<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quick Bangs</title>
</head>
<body>
	<div id="status" role="status"></div>
	<!-- Configure lowercase custom triggers here; {{{s}}} is the encoded search term. -->
	<script type="application/json" id="config">
		{
			"defaultUrl": "https://google.com/search?q={{{s}}}",
			"quickerBangs": {
				"yt": "https://www.youtube.com/results?search_query={{{s}}}",
				"g": "https://www.google.com/search?q={{{s}}}"
			}
		}
	</script>
	<script>
		const userOptions = JSON.parse(document.getElementById('config').textContent);
		const params = new URLSearchParams(location.search);
		const query = params.get('q');
		let cacheScript;

		async function lookup(trigger) {
			if (Object.hasOwn(userOptions.quickerBangs, trigger)) return userOptions.quickerBangs[trigger];
			cacheScript ||= new Promise((resolve, reject) => {
				const script = document.createElement('script');
				script.src = './bangs.js';
				script.onload = resolve;
				script.onerror = () => reject(new Error('Could not load bang cache'));
				document.head.append(script);
			});
			try {
				await cacheScript;
				return await resolveBang(trigger);
			} catch (error) { console.warn('Bang lookup failed', error); }
		}

		function redirect(url, term) {
			location.replace(url.replaceAll('{{{s}}}', encodeURIComponent(term)));
		}

		async function handleRedirect() {
			if (!query) {
				document.getElementById('status').textContent = 'Ready. Add ?q=... to URL to search.';
				return;
			}
			// Find the first bang without splitting every ordinary search into tokens.
			const bang = /(?:^|\s)!([^\s]+)/.exec(query);
			let url;
			if (bang) {
				const trigger = bang[1].toLowerCase();
				url = Object.hasOwn(userOptions.quickerBangs, trigger)
					? userOptions.quickerBangs[trigger] : await lookup(trigger);
				if (url) {
					const term = (query.slice(0, bang.index) + ' ' + query.slice(bang.index + bang[0].length)).trim().replace(/\s+/g, ' ');
					redirect(url, term);
					return;
				}
			}
			const defaultTrigger = params.get('default')?.replace(/^!/, '').toLowerCase();
			if (defaultTrigger) url = await lookup(defaultTrigger);
			redirect(url || userOptions.defaultUrl, query);
		}

		handleRedirect().catch(error => {
			console.error('Bang lookup failed', error);
			redirect(userOptions.defaultUrl, query);
		});

		if ('serviceWorker' in navigator && !navigator.serviceWorker.controller?.scriptURL.endsWith('?v=3')) {
			navigator.serviceWorker.register('./sw.js?v=3').catch(error => console.warn('Offline cache unavailable', error));
		}
	</script>
	<style>
		body { background: #121212; color: #888; font-family: monospace; display: flex; min-height: 100vh; justify-content: center; align-items: center; margin: 0; }
	</style>
</body>
</html>
