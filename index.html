<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Redirecting...</title>
	<style>
		body {
			background: #121212;
			color: #555;
			font-family: monospace;
			display: flex;
			height: 100vh;
			justify-content: center;
			align-items: center;
			margin: 0;
		}
	</style>
</head>

<body>
	<div id="status"></div>
	<script>
		// --- CONFIGURATION START ---
		const userOptions = {
			// Default Bang Selection: URL to use if no bang is entered/found
			// "{{{s}}}" represents the query
			defaultUrl: "https://google.com/search?q={{{s}}}",

			// Quicker Bangs: Define custom bangs, override fetched bangs, or speed up specific bangs.
			// NOTE: This is checked before the official bang list, so commonly used bangs can be placed here for even faster resolution.
			// Format: "trigger": "url"
			quickerBangs: {
				"yt": "https://www.youtube.com/results?search_query={{{s}}}",
				"g": "https://www.google.com/search?q={{{s}}}",
				// "gh": "https://github.com/search?q={{{s}}}",
				// "rd": "https://www.reddit.com/search/?q={{{s}}}",
				// "local": "http://localhost:8080/search?q={{{s}}}"
			}
		};
		// --- CONFIGURATION END ---


		// Register PWA
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('/sw.js');
			console.log("Registered PWA.");
		}
		// Fetch from Kagi instead of DDG: More comprehensive list of bangs
		const BANGS_URL = "https://raw.githubusercontent.com/kagisearch/bangs/refs/heads/main/data/bangs.json";
		const DB_NAME = 'quickbangs';
		const STORE_NAME = 'bangs';
		const cacheTimeout = 2592000000; // 30 Days
		// Free the multi-MB array used by older versions of this page.
		localStorage.removeItem('ud_bangs');
		async function handleRedirect() {
			const params = new URLSearchParams(window.location.search);
			const query = params.get('q');
			const statusDiv = document.getElementById('status');
			if (!query) {
				statusDiv.innerText = "Ready. Add ?q=... to URL to search.";
				return;
			}
			statusDiv.innerText = "Processing...";
			const { trigger, term } = parseQuery(query);
			// Start with User Default. The bang is only stripped from the search
			// text when it actually resolves; an unmatched bang is searched literally.
			let url = userOptions.defaultUrl;
			let searchTerm = query;
			if (trigger) {
				// Check Custom Bangs (Priority & O(1) Speed, no DB opened)
				if (userOptions.quickerBangs[trigger]) {
					url = userOptions.quickerBangs[trigger];
					searchTerm = term;
				}
				// Check External Kagi Bangs (single keyed lookup, no full-list parse)
				else {
					await ensureBangsFresh(statusDiv);
					const found = await getBangUrl(trigger);
					if (found) { url = found; searchTerm = term; }
				}
			}
			window.location.replace(url.replace('{{{s}}}', encodeURIComponent(searchTerm)));
		}
		// Extract the bang trigger and the remaining search term once.
		function parseQuery(query) {
			const match = query.match(/!(\w+)/);
			if (!match) return { trigger: null, term: query };
			const trigger = match[1];
			return { trigger, term: query.replace(`!${trigger}`, '').trim() };
		}
		// Open (or create) the IndexedDB store, memoized so we open at most once.
		let dbPromise;
		function openDB() {
			if (!dbPromise) {
				dbPromise = new Promise((resolve, reject) => {
					const req = indexedDB.open(DB_NAME, 1);
					req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
					req.onsuccess = () => resolve(req.result);
					req.onerror = () => reject(req.error);
				});
			}
			return dbPromise;
		}
		// Refresh the IndexedDB cache if it's missing or older than the timeout.
		async function ensureBangsFresh(statusDiv) {
			const timestamp = localStorage.getItem('ud_time');
			if (timestamp && (Date.now() - timestamp < cacheTimeout)) return;
			statusDiv.innerText = "Updating bang cache...";
			try {
				const res = await fetch(BANGS_URL);
				const text = await res.text();
				const json = JSON.parse(text.replace(/^var bangs = /, '').replace(/;$/, ''));
				const db = await openDB();
				await new Promise((resolve, reject) => {
					const tx = db.transaction(STORE_NAME, 'readwrite');
					const store = tx.objectStore(STORE_NAME);
					store.clear();
					// Key every trigger/alias to its url. First match wins, so we skip
					// keys already seen (mirrors the old earliest-entry .find()).
					const seen = new Set();
					for (const b of json) {
						for (const key of [b.t, ...(b.ts || [])]) {
							if (key && !seen.has(key)) {
								seen.add(key);
								store.put(b.u, key);
							}
						}
					}
					tx.oncomplete = resolve;
					tx.onerror = () => reject(tx.error);
				});
				localStorage.setItem('ud_time', Date.now());
			} catch (e) {
				// Leave ud_time unset so the next redirect retries the fetch.
				console.error("Fetch failed", e);
			}
		}
		// Look up a single bang url by trigger without parsing the whole list.
		async function getBangUrl(trigger) {
			try {
				const db = await openDB();
				return await new Promise((resolve, reject) => {
					const req = db.transaction(STORE_NAME, 'readonly')
						.objectStore(STORE_NAME).get(trigger);
					req.onsuccess = () => resolve(req.result);
					req.onerror = () => reject(req.error);
				});
			} catch (e) {
				console.error("Lookup failed", e);
				return undefined;
			}
		}
		handleRedirect();
	</script>
</body>

</html>
